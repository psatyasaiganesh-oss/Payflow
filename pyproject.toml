[project]
name = "payflow-reliability-lab"
version = "1.0.0"
description = "A portfolio lab for idempotent test payments and durable webhook processing"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100
