name: PayFlow checks
"on": [push, pull_request]
jobs:
  sqlite:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: payflow
          POSTGRES_USER: payflow
          POSTGRES_PASSWORD: ci_local_only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U payflow -d payflow"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PAYFLOW_TEST_DATABASE_URL: postgresql+psycopg://payflow:ci_local_only@localhost:5432/payflow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
  browser-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test tests/demo-store.test.mjs
      - run: node --check web/app.js
